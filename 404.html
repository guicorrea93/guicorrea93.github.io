<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Pagina nao encontrada - Portfolio Guilherme Correa" />
  <title>404 | Guilherme Correa</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="assets/favicons/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicons/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicons/apple-touch-icon.png" />

  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .error-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }
    .error-title {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      color: var(--text);
      margin: 1rem 0 0.5rem;
    }
    .error-text {
      color: var(--muted);
      font-size: 1rem;
      max-width: 420px;
      margin-bottom: 2rem;
    }
    .error-link {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: var(--accent);
      color: var(--bg);
      border-radius: var(--radius);
      font-weight: 600;
      transition: var(--transition);
    }
    .error-link:hover {
      opacity: 0.85;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <main class="error-page">
    <span class="error-code">404</span>
    <h1 class="error-title">Pagina nao encontrada</h1>
    <p class="error-text">
      A pagina que voce procura nao existe ou foi movida.
    </p>
    <a href="index.html" class="error-link">Voltar ao inicio</a>
  </main>
</body>
</html>
